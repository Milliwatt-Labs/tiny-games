<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name=robots content="noindex">
<meta name="color-scheme" content="light dark">
<title>Tic-tac-toe against a ternary model</title>
<link rel="icon" href="https://milliwattlabs.com/favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f6f6f4; --fg: #1b1b1b; --muted: #6b6b6b; --line: #d8d8d4; --cell: #ffffff;
  --x: #2563eb; --o: #dc2626; --win: #fde68a; --seg: #e8e8e4; --segOn: #1b1b1b; --segOnFg: #ffffff;
  --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e0e10; --fg: #f2f2f2; --muted: #9a9a9a; --line: #2c2c30; --cell: #18181b;
          --x: #60a5fa; --o: #f87171; --win: #4a3f14; --seg: #222226; --segOn: #f2f2f2; --segOnFg: #0e0e10; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
main { max-width: 420px; margin: 0 auto; padding: max(var(--space-lg), env(safe-area-inset-top)) var(--space-md)
  max(var(--space-lg), env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: var(--space-md); }
h1 { font-size: 28px; margin: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); }
.row > span { color: var(--muted); font-size: 15px; }
.seg { display: inline-flex; background: var(--seg); border-radius: 10px; padding: 3px; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 15px;
  padding: 7px 14px; border-radius: 8px; min-width: 56px; cursor: pointer; }
.row.stack { flex-direction: column; align-items: stretch; }
.row.stack .seg { display: flex; }
.row.stack .seg button { flex: 1 1 auto; min-width: 0; padding: 7px 4px; font-size: 14px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--segOn); color: var(--segOnFg); font-weight: 600; }
.seg button:disabled { cursor: default; opacity: 0.45; }
#board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; aspect-ratio: 1; }
#board button { appearance: none; border: 1px solid var(--line); background: var(--cell); border-radius: var(--radius);
  font: 700 min(18vw, 76px)/1 -apple-system, system-ui, sans-serif; color: var(--fg); padding: 0; cursor: pointer;
  touch-action: manipulation; }
#board button:disabled { cursor: default; color: inherit; opacity: 1; }
#board button.x { color: var(--x); }
#board button.o { color: var(--o); }
#board button.win { background: var(--win); }
#status { font-size: 20px; font-weight: 600; text-align: center; min-height: 28px; margin: 0; }
#new { appearance: none; border: 0; border-radius: var(--radius); background: var(--segOn); color: var(--segOnFg);
  font-family: inherit; font-size: 17px; font-weight: 600; padding: 14px; cursor: pointer; }
#tally { display: flex; justify-content: center; gap: var(--space-lg); color: var(--muted); font-size: 15px;
  margin: 0; font-variant-numeric: tabular-nums; }
#tally b { color: var(--fg); }
footer { text-align: center; font-size: 15px; margin-top: var(--space-sm); }
footer a { color: var(--muted); text-decoration: none; }
footer a:hover { color: var(--fg); text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1 data-copy="title"></h1>
  <div class="row stack"><span data-copy="net.label"></span>
    <div class="seg" id="net"><button data-v="xonly" data-copy="net.xonly"></button><button data-v="never" data-copy="net.never"></button><button data-v="finisher" data-copy="net.finisher"></button><button data-v="converter" data-copy="net.converter"></button><button data-v="optimal" data-copy="net.optimal"></button></div></div>
  <div class="row"><span data-copy="side.label"></span>
    <div class="seg" id="side"><button data-v="1" data-copy="side.x"></button><button data-v="2" data-copy="side.o"></button></div></div>
  <div id="board"></div>
  <p id="status" aria-live="polite"></p>
  <button id="new" data-copy="newGame"></button>
  <p id="tally"></p>
  <footer><a href="https://milliwattlabs.com/" data-copy="home"></a></footer>
</main>
<script type="application/json" id="nets">__NETS__</script>
<script type="application/json" id="copy">__COPY__</script>
<script id="engine">
// Integer forward pass, a line-for-line port of tictactoe/net.py choose_move and game.py.
// Board: 9 ints, row-major, 0 empty, 1 X, 2 O. No DOM here: tests/page_parity.mjs runs this block in Node.
var EMPTY = 0, X = 1, O = 2;
var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function winnerLine(b) {
  for (var i = 0; i < LINES.length; i++) {
    var l = LINES[i];
    if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return l;
  }
  return null;
}

function toMove(b) {
  var nx = 0, no = 0;
  for (var i = 0; i < 9; i++) { if (b[i] === X) nx++; else if (b[i] === O) no++; }
  return nx === no ? X : O;
}

function rot(p) { var q = []; for (var i = 0; i < 9; i++) q.push(p[6 - 3 * (i % 3) + Math.floor(i / 3)]); return q; }
function flip(p) { var q = []; for (var i = 0; i < 9; i++) q.push(p[3 * Math.floor(i / 3) + 2 - i % 3]); return q; }

// Same order as game._symmetries: identity, flip, then rotate and repeat.
var SYMS = (function () {
  var out = [], p = [0,1,2,3,4,5,6,7,8];
  for (var k = 0; k < 4; k++) { out.push(p); out.push(flip(p)); p = rot(p); }
  return out;
})();

function transform(b, p) { var t = []; for (var i = 0; i < 9; i++) t.push(b[p[i]]); return t; }

function lexLess(a, b) {
  for (var i = 0; i < 9; i++) { if (a[i] !== b[i]) return a[i] < b[i]; }
  return false;
}

// Lexicographically smallest image; the first symmetry wins ties, as in game.canonical.
function canonical(b) {
  var best = null, bp = null;
  for (var k = 0; k < SYMS.length; k++) {
    var t = transform(b, SYMS[k]);
    if (best === null || lexLess(t, best)) { best = t; bp = SYMS[k]; }
  }
  return [best, bp];
}

function encode(b, encoding) {
  var me = toMove(b), x = [], i;
  if (encoding === "planes") {
    for (i = 0; i < 9; i++) x.push(b[i] === me ? 1 : 0);
    for (i = 0; i < 9; i++) x.push(b[i] && b[i] !== me ? 1 : 0);
    return x;
  }
  if (encoding === "trits") {
    for (i = 0; i < 9; i++) x.push(b[i] === EMPTY ? 0 : (b[i] === me ? 1 : -1));
    return x;
  }
  throw new Error("unknown encoding " + encoding);
}

function forwardInt(net, x) {
  var h = x.slice(), last = net.layers.length - 1;
  for (var li = 0; li <= last; li++) {
    var W = net.layers[li].W, bias = net.layers[li].b, z = [];
    for (var r = 0; r < W.length; r++) {
      var s = bias[r], row = W[r];
      for (var c = 0; c < row.length; c++) { if (row[c]) s += row[c] * h[c]; }
      if (li < last) s = net.act === "relu" ? Math.max(0, s) : (s >= 0 ? 1 : 0);
      z.push(s);
    }
    h = z;
  }
  return h;
}

function argmaxLegal(z, b) {
  var best = -1;
  for (var m = 0; m < 9; m++) {
    if (b[m] === EMPTY && (best < 0 || z[m] > z[best])) best = m;
  }
  return best;
}

function chooseMove(net, b) {
  if (net.symmetry) {
    var c = canonical(b);
    return c[1][argmaxLegal(forwardInt(net, encode(c[0], net.encoding)), c[0])];
  }
  return argmaxLegal(forwardInt(net, encode(b, net.encoding)), b);
}
</script>
<script>
(function () {
  var NETS = JSON.parse(document.getElementById("nets").textContent);
  var COPY = JSON.parse(document.getElementById("copy").textContent);
  var KEY = "ttt.v1";
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { saved = {}; }
  var state = {
    net: NETS[saved.net] ? saved.net : "finisher",
    you: saved.you === O ? O : X,
    tally: saved.tally || {},
    board: null, over: false, gen: 0
  };

  document.querySelectorAll("[data-copy]").forEach(function (el) { el.textContent = COPY[el.dataset.copy]; });
  document.title = COPY.title;

  var boardEl = document.getElementById("board"), cells = [];
  for (var i = 0; i < 9; i++) {
    var btn = document.createElement("button");
    btn.dataset.i = i;
    btn.setAttribute("aria-label", COPY.cell + " " + (i + 1));
    btn.addEventListener("click", onCell);
    boardEl.appendChild(btn);
    cells.push(btn);
  }
  var statusEl = document.getElementById("status"), tallyEl = document.getElementById("tally");

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ net: state.net, you: state.you, tally: state.tally })); } catch (e) {}
  }
  // The X-only net always opens as X, so you play O against it.
  function you() { return NETS[state.net].x_only ? O : state.you; }
  function t() { return state.tally[state.net] || (state.tally[state.net] = { win: 0, draw: 0, loss: 0 }); }

  function render() {
    var line = winnerLine(state.board), yours = !state.over && toMove(state.board) === you();
    for (var i = 0; i < 9; i++) {
      var v = state.board[i], c = cells[i];
      c.textContent = v === X ? "X" : v === O ? "O" : "";
      c.className = (v === X ? "x" : v === O ? "o" : "") + (line && line.indexOf(i) >= 0 ? " win" : "");
      c.disabled = !yours || v !== EMPTY;
    }
    document.querySelectorAll("#net button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.v === state.net); });
    document.querySelectorAll("#side button").forEach(function (b) {
      b.setAttribute("aria-pressed", +b.dataset.v === you());
      b.disabled = !!NETS[state.net].x_only;
    });
    var k = t();
    tallyEl.innerHTML = "";
    [["tally.wins", k.win], ["tally.draws", k.draw], ["tally.losses", k.loss]].forEach(function (p) {
      var s = document.createElement("span"), n = document.createElement("b");
      n.textContent = p[1];
      s.textContent = COPY[p[0]] + " ";
      s.appendChild(n);
      tallyEl.appendChild(s);
    });
  }

  function finish() {
    var line = winnerLine(state.board), full = state.board.every(function (v) { return v; });
    if (!line && !full) return false;
    state.over = true;
    var r = !line ? "draw" : state.board[line[0]] === you() ? "win" : "loss";
    t()[r]++;
    save();
    statusEl.textContent = COPY["status." + r];
    return true;
  }

  function netTurn() {
    var gen = state.gen;
    statusEl.textContent = COPY["status.thinking"];
    render();
    setTimeout(function () {
      if (gen !== state.gen) return;
      state.board[chooseMove(NETS[state.net], state.board)] = toMove(state.board);
      if (!finish()) statusEl.textContent = COPY["status.yourMove"];
      render();
    }, 280);
  }

  function onCell(e) {
    var i = +e.currentTarget.dataset.i;
    if (state.over || state.board[i] !== EMPTY || toMove(state.board) !== you()) return;
    state.board[i] = you();
    if (finish()) { render(); return; }
    netTurn();
  }

  function newGame() {
    state.gen++;
    state.board = [0,0,0,0,0,0,0,0,0];
    state.over = false;
    if (you() === O) { netTurn(); return; }
    statusEl.textContent = COPY["status.yourMove"];
    render();
  }

  document.getElementById("new").addEventListener("click", newGame);
  document.querySelectorAll("#net button").forEach(function (b) {
    b.addEventListener("click", function () { if (state.net !== b.dataset.v) { state.net = b.dataset.v; save(); newGame(); } });
  });
  document.querySelectorAll("#side button").forEach(function (b) {
    b.addEventListener("click", function () { var v = +b.dataset.v; if (!NETS[state.net].x_only && state.you !== v) { state.you = v; save(); newGame(); } });
  });
  newGame();
})();
</script>
</body>
</html>
